<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Snoopy</title>
</head>
<body>
    <article class="card">
        <div class="cover"></div>
        <img class="profile-picture" 
        src="https://i.ibb.co/mx5MP3d/2048c3631742584e1718bf027b8cfe74.jpg" 
        alt="Snoopy holding a beautiful pink flower">
        
        <div class="card-content">
            <h2>Snoopy♡</h2>
            <p class="subtitle">The World's Most Imaginative Beagle</p>

            <p class="description">
                Snoopy is a lovable, imaginative, and playful beagle who brings joy 
                through his funny adventures, charming personality, and big dreams.
            </p>

            <ul class="details">
                <li>
                    <span>Species</span>
                    <strong>Beagle Dog</strong>
                </li>
                <li>
                    <span>Interest</span>
                    <strong>Writing</strong>
                </li>
                <li>
                    <span>Bestfriend</span>
                    <strong>Woodstuck</strong>
                </li>

            </ul>
        </div>
    </article>
    
</body>
</html>
